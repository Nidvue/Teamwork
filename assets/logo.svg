<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"
     role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Teamwork logo</title>
  <desc id="logoDesc">Three connected nodes forming a small org chart on an indigo-to-cyan rounded square.</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#mark)"/>
  <g stroke="#0b1020" stroke-width="6" stroke-linecap="round">
    <line x1="38" y1="44" x2="90" y2="64"/>
    <line x1="38" y1="84" x2="90" y2="64"/>
    <line x1="38" y1="44" x2="38" y2="84"/>
  </g>
  <circle cx="38" cy="44" r="11" fill="#0b1020"/>
  <circle cx="38" cy="84" r="11" fill="#0b1020"/>
  <circle cx="90" cy="64" r="13" fill="#ffffff"/>
</svg>
