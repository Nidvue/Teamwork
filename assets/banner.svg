<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360"
     viewBox="0 0 1280 360" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Teamwork - one prompt in, a whole company of agents out</title>
  <desc id="bannerDesc">Teamwork wordmark with a small org chart of CEO, Architect, Developer, Tester and Reviewer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- logo mark: three connected nodes -->
  <g transform="translate(80,92)">
    <rect x="0" y="0" width="132" height="132" rx="30" fill="url(#accent)"/>
    <g stroke="#0b1020" stroke-width="6" stroke-linecap="round">
      <line x1="38" y1="44" x2="94" y2="66"/>
      <line x1="38" y1="88" x2="94" y2="66"/>
      <line x1="38" y1="44" x2="38" y2="88"/>
    </g>
    <circle cx="38" cy="44" r="12" fill="#0b1020"/>
    <circle cx="38" cy="88" r="12" fill="#0b1020"/>
    <circle cx="94" cy="66" r="14" fill="#ffffff"/>
  </g>

  <!-- wordmark -->
  <text x="244" y="166" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">Teamwork</text>
  <text x="248" y="214" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="22" fill="#c7d2fe">One prompt in. A whole company of agents out.</text>

  <!-- role chips -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     font-size="15" fill="#e0e7ff" text-anchor="middle">
    <rect x="248" y="248" width="74" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="285" y="271">CEO</text>
    <rect x="334" y="248" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="390" y="271">Architect</text>
    <rect x="458" y="248" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="517" y="271">Developer</text>
    <rect x="588" y="248" width="84" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="630" y="271">Tester</text>
    <rect x="684" y="248" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="738" y="271">Reviewer</text>
  </g>

  <!-- mini org chart -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     font-size="16" text-anchor="middle">
    <g stroke="#818cf8" stroke-opacity="1" stroke-width="2" fill="none">
      <line x1="1010" y1="120" x2="890" y2="200"/>
      <line x1="1010" y1="120" x2="1010" y2="200"/>
      <line x1="1010" y1="120" x2="1130" y2="200"/>
    </g>
    <rect x="952" y="78" width="116" height="44" rx="12" fill="url(#accent)"/>
    <text x="1010" y="106" fill="#0b1020" font-weight="700">CEO</text>

    <rect x="832" y="200" width="116" height="44" rx="12" fill="#111735" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="890" y="228" fill="#e0e7ff">Architect</text>
    <rect x="952" y="200" width="116" height="44" rx="12" fill="#111735" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="1010" y="228" fill="#e0e7ff">Developer</text>
    <rect x="1072" y="200" width="116" height="44" rx="12" fill="#111735" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="1130" y="228" fill="#e0e7ff">Reviewer</text>

    <g stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2" fill="none">
      <line x1="890" y1="244" x2="890" y2="288"/>
      <line x1="1130" y1="244" x2="1130" y2="288"/>
    </g>
    <rect x="832" y="288" width="116" height="40" rx="12" fill="#0e1430" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="890" y="314" fill="#a5f3fc" font-size="14">Tester</text>
    <rect x="1072" y="288" width="116" height="40" rx="12" fill="#0e1430" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="1130" y="314" fill="#a5f3fc" font-size="14">Ledger</text>
  </g>
</svg>
