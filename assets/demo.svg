<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"
     role="img" aria-labelledby="demoTitle demoDesc" xml:space="preserve">
  <title id="demoTitle">Terminal animation: install the skill, then one request that names it</title>
  <desc id="demoDesc">The skill is installed with a single git clone into the project skills directory. The agent then receives "use the teamwork skill: Build a URL shortener with a CLI, tests and docs": the CEO staffs the roster, writes AGENTS.md, the team documents, role-shared queues and the hash-chained ledger, and the loop gate reports CONTINUE until every acceptance criterion is verified. The same commands are in the README quickstart and in "Common ways to use it".</desc>

  <style type="text/css"><![CDATA[
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { fill: #3fb950; }
    .cmd    { fill: #e6edf3; }
    .dim    { fill: #8b949e; }
    .out    { fill: #c9d1d9; }
    .ok     { fill: #3fb950; }
    .ceo    { fill: #d2a8ff; }
    .warn   { fill: #d29922; }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .t1 { animation: type 1.6s steps(40, end) 0.2s both; }
    .t1b { animation: type 0.5s steps(20, end) 2.0s both; }
    .t2 { animation: type 1.2s steps(40, end) 3.4s both; }
    .t3 { animation: type 0.6s steps(20, end) 5.9s both; }
    .a1 { animation: fade 0.25s ease-out 2.60s both; }
    .a2 { animation: fade 0.25s ease-out 4.80s both; }
    .a3 { animation: fade 0.25s ease-out 5.05s both; }
    .a4 { animation: fade 0.25s ease-out 5.30s both; }
    .a5 { animation: fade 0.25s ease-out 6.60s both; }
    .a6 { animation: fade 0.20s ease-out 6.90s both; }
    .cur { animation: blink 1s steps(1, end) 6.9s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .t1, .t1b, .t2, .t3, .a1, .a2, .a3, .a4, .a5, .a6, .cur {
        animation: none !important; clip-path: none !important; opacity: 1 !important;
      }
    }
  ]]></style>

  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
  </defs>

  <rect width="960" height="560" fill="#020409"/>
  <rect x="20" y="20" width="920" height="520" rx="18" fill="url(#win)" stroke="#30363d"/>
  <path d="M38 20 H922 A18 18 0 0 1 940 38 V66 H20 V38 A18 18 0 0 1 38 20 Z" fill="#161b22"/>
  <line x1="20" y1="66" x2="940" y2="66" stroke="#30363d"/>
  <circle cx="48" cy="43" r="7" fill="#ff5f56"/>
  <circle cx="72" cy="43" r="7" fill="#ffbd2e"/>
  <circle cx="96" cy="43" r="7" fill="#27c93f"/>
  <text x="480" y="49" text-anchor="middle" font-size="15" class="dim">my-project - agent</text>

  <text x="48" y="104" font-size="15" class="t1" clip-path="inset(0 100% 0 0)"><tspan class="prompt">$ </tspan><tspan class="cmd">git clone --depth 1 https://github.com/Nidvue/Teamwork.git .agents/skills/teamwork</tspan></text>
  <text x="48" y="134" font-size="15" class="t1b" clip-path="inset(0 100% 0 0)"><tspan class="prompt">$ </tspan><tspan class="cmd">rm -rf .agents/skills/teamwork/.git</tspan></text>
  <text x="48" y="164" font-size="15" class="a1"><tspan class="ok">[skill] </tspan><tspan class="out">SKILL.md + 15 role charters + engine - installed, nothing to build</tspan></text>

  <text x="48" y="210" font-size="15" class="t2" clip-path="inset(0 100% 0 0)"><tspan class="prompt">&gt; </tspan><tspan class="cmd">use the teamwork skill: Build a URL shortener with a CLI, tests and docs</tspan></text>
  <text x="48" y="240" font-size="15" class="a2"><tspan class="ceo">[ceo] </tspan><tspan class="out">objective accepted: 12 roles staffed, 3 lanes running</tspan></text>
  <text x="48" y="270" font-size="15" class="a3"><tspan class="ok">  [ok] </tspan><tspan class="out">AGENTS.md constitution + docs/Team/ project documents</tspan></text>
  <text x="48" y="300" font-size="15" class="a4"><tspan class="ok">  [ok] </tspan><tspan class="out">Roles/ shared queues + Ledger.jsonl hash-chained</tspan></text>

  <text x="48" y="346" font-size="15" class="t3" clip-path="inset(0 100% 0 0)"><tspan class="prompt">$ </tspan><tspan class="cmd">teamwork loop</tspan></text>
  <text x="48" y="376" font-size="15" class="a5"><tspan class="warn">  CONTINUE - </tspan><tspan class="out">12 acceptance criteria unverified</tspan></text>

  <text x="48" y="426" font-size="15" class="a6"><tspan class="prompt">&gt; </tspan></text>
  <rect x="66" y="412" width="9" height="18" fill="#3fb950" class="cur"/>
</svg>
