[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teamwork-agents"
dynamic = ["version"]
description = "Nidvue Teamwork - a coding-agent skill that runs an evidence-gated multi-agent team; optional stdlib-only engine (per-agent model configuration)."
requires-python = ">=3.9"
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "Nidvue contributors" }]
keywords = [
  "teamwork",
  "multi-agent",
  "agents",
  "orchestration",
  "automation",
  "agent-skills",
  "skill",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
]
# Zero runtime dependencies: the engine is standard-library only.
dependencies = []

[project.optional-dependencies]
dev = [
  # Ranges keep Python 3.9 supported: pytest 9, mypy 2 and build 1.6 need 3.10+.
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<0.18",
  "mypy>=1.14,<3",
  "build>=1.2,<2",
  # `make docs` is part of `make release-check`, so its builder must arrive with
  # the other gates; the range is the one docs/requirements.txt pins (asserted in
  # tests/unit/test_makefile_contracts.py).
  "mkdocs-material>=9.7.7,<10",
]

[project.scripts]
teamwork = "teamwork.cli:main"

[project.urls]
Homepage = "https://github.com/Nidvue/Teamwork"
Documentation = "https://github.com/Nidvue/Teamwork#readme"
Repository = "https://github.com/Nidvue/Teamwork"
Changelog = "https://github.com/Nidvue/Teamwork/blob/main/CHANGELOG.md"
Issues = "https://github.com/Nidvue/Teamwork/issues"

# --------------------------------------------------------------------------- #
# Build: src layout + the canonical skill bundle force-included into the wheel
# at `teamwork/data/` so an installed package can resolve its own assets.
# --------------------------------------------------------------------------- #

[tool.hatch.version]
path = "src/teamwork/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/teamwork"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "teamwork/data/SKILL.md"
"roles" = "teamwork/data/roles"
"references" = "teamwork/data/references"
"templates" = "teamwork/data/templates"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/SKILL.md",
  "/roles",
  "/references",
  "/templates",
  "/scripts",
  "/tests",
  "/docs",
  "/assets",
  "/AGENTS.md",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/CITATION.cff",
  "/pyproject.toml",
  "/Makefile",
  "/mkdocs.yml",
  "/.editorconfig",
  "/.gitattributes",
  "/.gitignore",
]
exclude = [
  "/dist",
  "/build",
  "/site",
  "/.venv",
  "/.pi",
  "/**/__pycache__",
  "**/*.py[cod]",
]

# --------------------------------------------------------------------------- #
# Development tooling
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "scripts"]
extend-exclude = ["dist", "build", "site", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"scripts/teamwork.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
# Mirrors the mypy override below. `engine.py` is the ported command layer and
# keeps its v1.0 typing exemption; every other module is expected to be clean.
# The canonical gate is `mypy src/teamwork` (Makefile / CI); this section stops a
# second checker from reporting the same accepted exemption as 39 errors.
include = ["src/teamwork"]
exclude = ["src/teamwork/engine.py"]
ignore = ["src/teamwork/engine.py"]

[tool.mypy]
# NOTE: mypy >= 1.19 no longer accepts `python_version = "3.9"`. The project still
# supports 3.9 - that compatibility is enforced by `ruff` with
# `target-version = "py39"` plus `from __future__ import annotations` - while mypy
# types the code against the interpreter running it (3.12 in CI).
files = ["src/teamwork"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true

# The package split moved records, paths, names, IO and git plumbing into typed
# modules. The remaining command layer (engine.py) keeps its v1.0 typing
# exemption; every other module must be clean.
[[tool.mypy.overrides]]
module = ["teamwork.engine"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
# Warnings are errors: a warning raised by this project's own code fails the suite.
# A third-party warning gets a narrow, reasoned entry here, never a blanket ignore.
filterwarnings = ["error"]
norecursedirs = ["dist", "build", "site", ".venv", ".pi", "*.egg"]

[tool.coverage.run]
source = ["teamwork"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
# A floor, not a target: it stops a large coverage regression while the engine
# remains a tracked post-1.0 typing/splitting refactor.
fail_under = 55
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
