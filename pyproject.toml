[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teamwork-agents"
dynamic = ["version"]
description = "Nidvue Teamwork - a coding-agent skill that runs an evidence-gated multi-agent team; optional stdlib-only engine (per-agent model configuration)."
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "Nidvue contributors" }]
keywords = [
  "teamwork",
  "multi-agent",
  "agents",
  "orchestration",
  "automation",
  "agent-skills",
  "skill",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
]
# Zero runtime dependencies: the engine is standard-library only.
dependencies = []

[project.optional-dependencies]
dev = [
  # Every dev tool runs on the 3.11 floor; the ranges keep the newest releases in.
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  # The CI matrix runs every cell with `-n auto` (T-0105): the suite spawns
  # hundreds of processes and the hosted runners give 3-4 vCPUs, so the cells are
  # wall-clock bound rather than CPU bound. Measured on the 4-worker emulation:
  # 242s serial, 94s with `-n 4`, same outcome serial and parallel (2742 passed,
  # 2 failed, 10 skipped at faeafce; 2751/2/10 of 2763 collected at the revision
  # that adds the macOS-subset mutant). The 2 failures are the pre-existing
  # tests/integration/test_memory_pack_flow.py cases from T-0097, not a
  # parallel-run difference.
  "pytest-xdist>=3,<4",
  "ruff>=0.9,<0.18",
  "mypy>=1.14,<3",
  "build>=1.2,<2",
  # `make docs` is part of `make release-check`, so its builder must arrive with
  # the other gates; the range is the one docs/requirements.txt pins (asserted in
  # tests/unit/test_makefile_contracts.py).
  "mkdocs-material>=9.7.7,<10",
]
# Rebuilds assets/social-preview.png through scripts/render_social_preview.py,
# which `tests/integration/test_integration_probes.py` replays byte-for-byte. Kept
# out of `dev` because cairosvg needs system cairo: where it is absent that case
# skips naming this extra, and no CI job installs it (T-0002).
imaging = [
  "cairosvg>=2.7,<3",
  "Pillow>=10,<14",
]

[project.scripts]
teamwork = "teamwork.cli:main"

[project.urls]
Homepage = "https://github.com/Nidvue/Teamwork"
Documentation = "https://github.com/Nidvue/Teamwork#readme"
Repository = "https://github.com/Nidvue/Teamwork"
Changelog = "https://github.com/Nidvue/Teamwork/blob/main/CHANGELOG.md"
Issues = "https://github.com/Nidvue/Teamwork/issues"

# --------------------------------------------------------------------------- #
# Build: src layout + the canonical skill bundle force-included into the wheel
# at `teamwork/data/` so an installed package can resolve its own assets.
# --------------------------------------------------------------------------- #

[tool.hatch.version]
path = "src/teamwork/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/teamwork"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "teamwork/data/SKILL.md"
"roles" = "teamwork/data/roles"
"references" = "teamwork/data/references"
"templates" = "teamwork/data/templates"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/SKILL.md",
  "/roles",
  "/references",
  "/templates",
  "/scripts",
  "/tests",
  "/docs",
  "/assets",
  "/AGENTS.md",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/CITATION.cff",
  "/pyproject.toml",
  "/Makefile",
  "/mkdocs.yml",
  "/.editorconfig",
  "/.gitattributes",
  "/.gitignore",
]
exclude = [
  "/dist",
  "/build",
  "/site",
  "/.venv",
  "/.pi",
  "/**/__pycache__",
  "**/*.py[cod]",
]

# --------------------------------------------------------------------------- #
# Development tooling
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["dist", "build", "site", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# The T-0002 lane owns this file; until it adopts zip(strict=), the one finding is
# scoped here by name rather than edited from a lane that does not hold the file.
"tests/unit/test_traceability_matrix.py" = ["B905"]
"scripts/teamwork.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
# The canonical gate is `mypy src/teamwork` (Makefile / CI); this section keeps a
# second checker on the same file set. No module is excluded: engine.py is
# type-checked like every other module since T-0018 removed its exemption.
include = ["src/teamwork"]

[tool.mypy]
# NOTE: the supported floor is 3.11, enforced by `requires-python`, the 3.11 CI
# lane and `ruff` with `target-version = "py311"`. mypy customarily types the code
# against the interpreter running it (3.12 in CI) rather than pinning
# `python_version`; `from __future__ import annotations` stays as the one lazy
# annotation convention across the tree.
files = ["src/teamwork"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true

# Every module under src/teamwork is checked, engine.py included. The command
# layer carried a v1.0 `ignore_errors` exemption until T-0018 removed it;
# tests/unit/test_typing_gate.py keeps a standing exemption from coming back.

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
# Warnings are errors: a warning raised by this project's own code fails the suite.
# A third-party warning gets a narrow, reasoned entry here, never a blanket ignore.
filterwarnings = ["error"]
norecursedirs = ["dist", "build", "site", ".venv", ".pi", "*.egg"]

[tool.coverage.run]
source = ["teamwork"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
# A floor, not a target: it stops a large coverage regression while the engine
# remains a tracked post-1.0 splitting refactor.
fail_under = 55
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
