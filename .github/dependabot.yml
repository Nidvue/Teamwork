# Dependabot configuration for teamwork-agents.
#
# Contract: docs/Team/Architecture.md (section 9). Weekly updates for the Python
# toolchain (pip) and for the GitHub Actions used by the workflows.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      python-dev:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docs
    ignore:
      # mkdocs-material 9.8.0 requires Python >= 3.11, while this project
      # supports 3.9 (pyproject requires-python and the CI matrix) and the dev
      # extra must carry the same range as this file. The shared range already
      # allows 9.8.0 where the interpreter supports it, so only the floor bump
      # is refused; drop this entry when Python 3.9 and 3.10 are dropped.
      - dependency-name: "mkdocs-material"
        versions:
          - ">=9.8.0"

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python
