name: Feature request
description: Propose a capability or improvement for Teamwork.
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Proposals are strongest when they describe the problem, not just the
        solution. Please check the roadmap and existing issues first.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and discussions for this request.
          required: true
        - label: This is a single, focused request (not a bundle of ideas).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do that Teamwork makes hard today?
      placeholder: "When bootstrapping a team I have to ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Sketch the CLI, config or workspace shape.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / engine
        - Workspace format
        - Packaging / install
        - CI / release
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Willing to contribute?
      options:
        - label: I am willing to open a pull request for this.
          required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Use cases, prior art, references.
    validations:
      required: false
