name: Bug report
description: Report a reproducible problem with Teamwork.
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. A minimal reproduction gets a
        fix far faster than a description alone.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      description: Please confirm the following before submitting.
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: I can reproduce this on the latest release or `main`.
          required: true
        - label: I have removed any secrets or personal data from the logs below.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behaviour, including the full error.
      placeholder: "teamwork task next developer exited with ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands from a clean state. Link a gist if long.
      placeholder: |
        1. python -m teamwork init
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Teamwork version
      description: Output of `teamwork --version` (or `python -m teamwork --version`).
      placeholder: "teamwork 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "Python 3.11.9"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      description: Paste verbatim. A traceback is worth a thousand words.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help - related issues, workarounds, screenshots.
    validations:
      required: false
