# Release pipeline for teamwork-agents.
#
# Contract: docs/Team/Architecture.md (section 9) and docs/Team/Project.md AC-7.
# Triggered only by a `v*` tag. Produces sdist + wheel, SHA256SUMS, a CycloneDX
# JSON and an SPDX JSON SBOM, attests build provenance, and publishes a GitHub
# Release with every asset. Nothing is pushed by an agent; the CEO owns the tag.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege: the workflow default is read-only; each job widens it only as
# far as it needs. `build` gets nothing beyond the default.
permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: build + checksums + SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum * > ../SHA256SUMS
          cd ..
          cat SHA256SUMS
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/
            SHA256SUMS
            sbom.cyclonedx.json
            sbom.spdx.json
          if-no-files-found: error

  attest:
    name: attest build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
            SHA256SUMS
            sbom.cyclonedx.json
            sbom.spdx.json

  release:
    name: publish GitHub Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            SHA256SUMS
            sbom.cyclonedx.json
            sbom.spdx.json
