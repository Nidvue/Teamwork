# Release pipeline for teamwork-agents.
#
# Contract: docs/Team/Architecture.md (section 9) and docs/Team/Project.md AC-7.
# Triggered only by a `v*` tag. Produces sdist + wheel, SHA256SUMS, a CycloneDX
# JSON and an SPDX JSON SBOM, attests build provenance, and publishes a GitHub
# Release with every asset. Nothing is pushed by an agent; the CEO owns the tag.

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: the workflow default is read-only; each job widens it only as
# far as it needs. `build` gets nothing beyond the default.
permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: build + checksums + SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Assert the tag matches the package version
        shell: bash
        run: |
          python - <<'PY'
          import re, pathlib, os
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          version = re.search(r'__version__ = "([^"]+)"',
                              pathlib.Path("src/teamwork/version.py").read_text()).group(1)
          if tag != version:
              raise SystemExit(f"tag v{tag} != package version {version}: bump "
                               "src/teamwork/version.py and CHANGELOG.md before tagging")
          print(f"tag and version agree: {version}")
          PY
      - name: Test the tagged revision
        run: python -m pytest -q
      - name: Build and verify the release artefacts
        run: python scripts/verify_release.py
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Checksum every published asset
        shell: bash
        run: |
          sha256sum dist/* sbom.cyclonedx.json sbom.spdx.json > SHA256SUMS
          cat SHA256SUMS
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: |
            dist/
            SHA256SUMS
            sbom.cyclonedx.json
            sbom.spdx.json
          if-no-files-found: error

  attest:
    name: attest build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*
            SHA256SUMS
            sbom.cyclonedx.json
            sbom.spdx.json

  release:
    name: publish GitHub Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            dist/*
            SHA256SUMS
            sbom.cyclonedx.json
            sbom.spdx.json
