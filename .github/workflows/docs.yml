# Documentation checks: link health, privacy scan and a strict site build.
#
# Contract: docs/Team/Architecture.md (section 9), docs/Team/Project.md AC-6.
#
# Trigger policy: the `ci.yml` scope job classifies the change and skips the
# 3x3 test matrix on a prose-only push, so a prose edit never runs the matrix.
# Those paths land here instead, where the cheap checks that actually matter for
# prose still run - `teamwork links`, the privacy scan (a documentation leak is
# still a leak) and `mkdocs build --strict`. Code changes do not need this
# workflow: the site content did not change.
#
# A `v*` tag push builds and deploys the site from the *released* revision too.
# The `paths:` list below is a branch-push filter and nothing else, because
# "Path filters are not evaluated for pushes of tags." - quoted from
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpushpull_requestpull_request_targetpathspaths-ignore
# (accessed 2026-10-28). So `tags: ["v*"]` fires on a tag whatever the changed
# paths are, and the deployed site stops being whatever `main` happened to hold
# on the last prose edit.

name: Docs

on:
  push:
    branches: [main]
    # A release deploys the site from the tag, not from an arbitrary later `main`.
    tags: ["v*"]
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "CITATION.cff"
      - "LICENSE"
      - "AGENTS.md"
      - "assets/**"
      - "mkdocs.yml"
  # Always run on a pull request: this workflow's check is required for a merge,
  # and a path-filtered skip would leave the check unreported.
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check:
    name: links + privacy + strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the privacy scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install package and docs tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r docs/requirements.txt
      - name: Link health (broken links, back-links)
        run: python scripts/teamwork.py links
      - name: Privacy scan (tree + history)
        run: python scripts/privacy_scan.py --tree --history --allow .github/privacy-allow.txt
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Upload Pages artifact
        # The deploy guard below accepts a tag as well as `main`; this one must
        # agree with it, or a tag run would deploy an artifact nobody built.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    # `main` for a prose push, `v*` for a release: the Pages environment allows
    # both (`gh api repos/Nidvue/Teamwork/environments/github-pages/deployment-branch-policies`
    # -> `main` type=branch and `v*` type=tag, measured 2026-10-28). A pull
    # request matches neither and never deploys.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
