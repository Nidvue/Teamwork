# Documentation checks: link health, privacy scan and a strict site build.
#
# Contract: docs/Team/Architecture.md (section 9), docs/Team/Project.md AC-6.
#
# Trigger policy: `ci.yml` ignores documentation-only paths so that a prose edit
# never runs the 3x3 test matrix. Those paths land here instead, where the cheap
# checks that actually matter for prose still run - `teamwork links`, the privacy
# scan (a documentation leak is still a leak) and `mkdocs build --strict`. Code
# changes do not need this workflow: the site content did not change.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "CITATION.cff"
      - "LICENSE"
      - "AGENTS.md"
      - "assets/**"
      - "mkdocs.yml"
  # Always run on a pull request: this workflow's check is required for a merge,
  # and a path-filtered skip would leave the check unreported.
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  check:
    name: links + privacy + strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the privacy scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and docs tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' || python -m pip install -e .
          python -m pip install mkdocs mkdocs-material
      - name: Link health (broken links, back-links)
        run: python scripts/teamwork.py links
      - name: Privacy scan (tree + history)
        run: python scripts/privacy_scan.py --tree --history
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
