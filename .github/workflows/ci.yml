# Continuous integration for teamwork-agents.
#
# Contract: docs/Team/Architecture.md (section 9, "CI / release contract", which
# is where the path filtering is described) and docs/Team/Project.md
# (AC-4 CI matrix, AC-5 privacy, AC-2 no runtime deps, AC-9 cross-platform).
#
# Jobs: scope, lint, typecheck (non-blocking), test (3 OS x 3 Python), build,
# privacy, committer guard, release-consistency, docs. Every job must be green on
# the pushed revision.
#
# Trigger policy: a documentation-only change must not burn the 3x3 test matrix,
# and a release-fact change must not escape the consistency gate. Those two rules
# used to fight: `paths-ignore` on the push trigger was the only filter available
# at workflow level, so a prose-only push skipped every job in this file -
# including a `release-consistency` job whose whole subject is prose that
# disagrees with a tag, `version.py` or `CHANGELOG.md`. A gate skipped exactly
# when the documentation drifts is worthless, so the workflow now always fires on
# `main`, on a `v*` tag and on every pull request; the `scope` job classifies the
# changed paths (the prose/media set below) and the expensive jobs skip on a push
# only. A pull request still runs the full set: required checks must be
# *reported* on the merge revision, and a path filtered skip reports nothing.
# Prose paths are still validated by `.github/workflows/docs.yml` (links, privacy
# scan, mkdocs --strict); the `scope` prose set and that workflow's `paths:` list
# must stay identical.
#
# The consistency gate in this file runs `--offline`, so R3/R4/R5/R8 (npm, the
# GitHub API, PyPI) print SKIP here. The online half lives in
# `.github/workflows/release.yml`, which holds the release token.

name: CI

on:
  push:
    branches: [main]
    # A tag is a release fact in its own right: R1/R2/R4/R5 compare every `v*`
    # tag with the version at its own commit, so the gate must also see the tag
    # that was just created, not only the branch push that preceded it.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref, but never a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  scope:
    name: scope (code or prose only)
    runs-on: ubuntu-latest
    # The workflow can no longer delegate the prose filter to `paths-ignore`
    # (see the header), so the changed-path set is computed here from git and the
    # matrix jobs ask one question: did this push touch anything that ships?
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout (full history so the push range resolves)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Classify the changed paths
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Only a push is a cost-optimised event. A pull request and a manual run
          # always execute the full set: a required check that is not reported
          # blocks a merge, and a path-filtered skip reports nothing at all.
          if [ "${EVENT_NAME}" != "push" ]; then
            echo "scope: ${EVENT_NAME} -> every job runs"
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # A tag push is not a code change: the tagged commit already passed this
          # matrix as a `main` push, and `release.yml` re-runs pytest on the tag. So
          # only the tag-sensitive jobs run here - `release-consistency` above all,
          # because R1/R2/R4/R5 compare the new tag itself with its own commit.
          case "${REF_NAME}" in
            refs/tags/*)
              echo "scope: tag push -> consistency gate only"
              echo "code=false" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          # The prose/media set. It must stay identical to the `paths:` list of
          # `.github/workflows/docs.yml`: a path that leaves one list without
          # joining the other is a hole in one of the two gates.
          PROSE='^(docs/|assets/|README\.md$|CHANGELOG\.md$|CONTRIBUTING\.md$|SECURITY\.md$|CODE_OF_CONDUCT\.md$|CITATION\.cff$|LICENSE$|AGENTS\.md$|mkdocs\.yml$)'
          # "before" is all-zero for a new branch and unresolvable after a rewrite,
          # so resolve what is actually there and otherwise fall back to the tip. A
          # root commit has no parent, so it needs --root to list its files at all.
          HEAD_REV="${HEAD_SHA:-$(git rev-parse HEAD)}"
          UNDETERMINED=0
          if [ -n "${BEFORE_SHA}" ] && git rev-parse --verify -q "${BEFORE_SHA}^{commit}" >/dev/null; then
            FILES=$(git diff --name-only "${BEFORE_SHA}" "${HEAD_REV}")
          else
            # `before` is unusable: the all-zero sha of a first push, or a sha
            # that no longer exists after a rewritten history. Diffing the tip
            # against its own parent (what this did before) reports only the
            # last commit and hides the source changes the push carried, so the
            # change set is measured from the widest base that is still known:
            # the fork point with the default branch, else the root commit.
            # When even that cannot be established the change set is
            # undetermined, and then the code jobs run: an unknown change set
            # must never silently skip the matrix.
            BASE=""
            for CANDIDATE in "origin/${DEFAULT_BRANCH}" "origin/HEAD"; do
              [ -n "${CANDIDATE}" ] || continue
              git rev-parse --verify -q "${CANDIDATE}^{commit}" >/dev/null || continue
              BASE=$(git merge-base "${HEAD_REV}" "${CANDIDATE}" 2>/dev/null || true)
              [ -n "${BASE}" ] && break
            done
            if [ -z "${BASE}" ]; then
              BASE=$(git rev-list --max-parents=0 "${HEAD_REV}" 2>/dev/null | tail -n 1)
            fi
            if [ -n "${BASE}" ] && [ "${BASE}" != "${HEAD_REV}" ]; then
              FILES=$(git diff --name-only "${BASE}" "${HEAD_REV}")
              [ -n "${FILES}" ] || UNDETERMINED=1
            elif [ "${BASE}" = "${HEAD_REV}" ]; then
              # HEAD is the root commit: every file it carries is the change set.
              FILES=$(git diff-tree --root --no-commit-id --name-only -r "${HEAD_REV}")
              [ -n "${FILES}" ] || UNDETERMINED=1
            else
              FILES=""
              UNDETERMINED=1
            fi
          fi
          if [ "${UNDETERMINED}" = "1" ]; then
            code=true
          elif [ -z "${FILES}" ]; then
            code=false
          elif printf '%s\n' "${FILES}" | grep -qvE "${PROSE}"; then
            code=true
          else
            code=false
          fi
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "scope: changed -> $(printf '%s ' "${FILES}")"
          echo "scope: code=${code}"

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    # A prose-only push cannot change a file ruff reads, so this is pure waste
    # there; it was skipped entirely by the old `paths-ignore`, and it still is.
    needs: scope
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true'
    steps:
      - name: Checkout (full history for the commit identity audit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: Commit identity audit
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            python scripts/teamwork.py identity --audit --range "origin/${BASE_REF}..HEAD"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            python scripts/teamwork.py identity --audit --range "${BEFORE_SHA}..${HEAD_SHA}"
          else
            python scripts/teamwork.py identity --audit --range HEAD
          fi

  committer-guard:
    name: committer guard (no account stamped into main)
    runs-on: ubuntu-latest
    # The earliest signal for the one mistake that has rewritten this branch
    # three times: a host merge button (squash or rebase) writes the signed-in
    # account into the commit it creates, and the privacy gate then fails on that
    # personal mailbox in the history - which fails the whole matrix through the
    # acceptance proof that re-runs it. This job fires on the push, with the
    # offending commit named and the repair printed.
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Guard the committer of the pushed revision
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # A pull_request event has no "before": GitHub sends the all-zero sha.
          # A push after a rewrite has a "before" that no longer resolves. Both
          # cases fall back to the tip, which is what can be measured.
          if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            python scripts/teamwork.py identity --guard-committer --range "${BEFORE_SHA}..${HEAD_SHA}" \
              || python scripts/teamwork.py identity --guard-committer --range HEAD
          else
            python scripts/teamwork.py identity --guard-committer --range HEAD
          fi

  typecheck:
    name: typecheck (mypy, non-blocking)
    runs-on: ubuntu-latest
    needs: scope
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true'
    # mypy is a report, not a gate: keep the signal without blocking the lane.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: mypy
        run: mypy src/teamwork

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: scope
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Assert the history is full
        shell: bash
        run: |
          # The archive guard skips itself in a shallow clone instead of failing.
          # That is correct for a contributor's shallow copy, and wrong for CI, so
          # the checkout config is asserted here rather than trusted.
          test "$(git rev-parse --is-shallow-repository)" = "false"
      - name: Run tests (junit + coverage)
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=teamwork \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=55
      - name: Upload junit + coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn

  build:
    name: build (sdist + wheel + verify)
    runs-on: ubuntu-latest
    needs: scope
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify release artifacts
        run: python scripts/verify_release.py
      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  privacy:
    name: privacy scan (tree + history)
    runs-on: ubuntu-latest
    needs: scope
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true'
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      # No `cache: pip` here on purpose: this job installs nothing, and
      # actions/setup-python's post step fails the job when the pip cache
      # directory it was told to save does not exist.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Scan working tree and full git history
        run: python scripts/privacy_scan.py --tree --history --allow .github/privacy-allow.txt

  release-consistency:
    name: release consistency (offline - docs + tags + version)
    runs-on: ubuntu-latest
    # Blocking on purpose - no `continue-on-error`. Every published fact about
    # "what version is out" (a git tag, an npm tarball, a GitHub Release, a
    # sentence in README.md or docs/Team/Release.md, the CHANGELOG entry, the
    # PyPI channel lines) must agree with `src/teamwork/version.py`. Exit 0 is
    # clean, exit 1 is drift, exit 2 is an unreadable input; 1 and 2 must fail
    # the run.
    #
    # `--offline` is deliberate. R3/R4/R5/R8 need the npm registry, the GitHub API
    # and PyPI; those need credentials and rate-limit headroom that does not
    # belong in every pull request, and an unauthenticated 403 would turn a gate
    # into a flake. Offline they print SKIP with the reason, and every local rule
    # (R1, R2, R6, R7, R9) still evaluates from the tree and the tags. The online
    # half lives in `.github/workflows/release.yml`, which holds the release
    # token; nothing in this file claims to run it.
    #
    # R2 is the one rule whose frozen semantics the checker does not implement
    # yet. `docs/Team/Architecture.md` section 11.2.2 freezes R2 over the
    # version tags *reachable from HEAD* minus the tags that *point at HEAD*
    # (`S = A - O`); `scripts/check_release_consistency.py` (developer task
    # T-0005) still compares HEAD with every version tag. On a tag push the two
    # disagree: the tag being published points at HEAD, so the checker reports
    # "HEAD version 1.1.2 is not greater than tag v1.1.2" and the gate is red on
    # the very build it exists to gate. The exemption below applies the frozen
    # tag set to the checker's findings: an R2 finding that names no tag in `S`
    # is not a finding under the contract, and every other finding - a genuine
    # drift, an unreadable input - still fails this job. It is removed as soon
    # as the checker implements 11.2.2 itself.
    steps:
      - name: Checkout (full history and tags - R1/R2/R4/R5 read git tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      # No `cache: pip` here on purpose: the gate is standard-library only and
      # installs nothing, and setup-python's post step fails the job when the pip
      # cache directory it was told to save does not exist.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Release consistency gate (offline)
        run: |
          set -uo pipefail
          REPORT="$(mktemp)"
          GATE_RC=0
          python scripts/check_release_consistency.py --offline --json > "${REPORT}" || GATE_RC=$?
          python - "${REPORT}" "${GATE_RC}" <<'PY'
          import json
          import re
          import subprocess
          import sys

          report, gate_rc = sys.argv[1], int(sys.argv[2])
          try:
              with open(report, encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, ValueError) as exc:
              # The checker did not produce a report: it is missing, unreadable
              # or crashed. Its own exit code is the truth (2 = an input could
              # not be read), and the job must fail either way.
              print(f"::error::the checker produced no report: {exc}", file=sys.stderr)
              raise SystemExit(gate_rc if gate_rc else 2)

          def git(*args):
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, check=False
              ).stdout.split()

          VERSION_TAG = re.compile(r"^v\d+\.\d+\.\d+$")
          tags = [tag for tag in git("tag", "-l") if VERSION_TAG.match(tag)]
          at_head = set(git("tag", "--points-at", "HEAD"))
          reachable = {
              tag
              for tag in tags
              if subprocess.run(
                  ["git", "merge-base", "--is-ancestor", tag, "HEAD"], check=False
              ).returncode
              == 0
          }
          # Architecture.md 11.2.2: S = A - O (reachable version tags minus the
          # tags that point at HEAD).
          frozen = reachable - at_head

          for rule in payload.get("rules", []):
              print(f"{rule['id']} {rule['status']} {rule['detail']}")

          exempt, others = [], []
          for problem in payload.get("problems", []):
              if problem.get("rule") == "R2":
                  named = set(re.findall(r"\btag (v\d+\.\d+\.\d+)\b", problem.get("detail", "")))
                  if named and not (named & frozen):
                      exempt.append(problem)
                      continue
              others.append(problem)

          for problem in exempt:
              print(
                  "R2 finding outside the frozen tag set of Architecture.md 11.2.2, "
                  f"not a drift: {problem['detail']}"
              )
          for problem in others:
              print(f"::error::{problem['rule']} DRIFT: {problem['detail']}", file=sys.stderr)
          print(f"# release consistency: {len(others)} problem(s)")

          if gate_rc == 2:
              print("::error::an input the gate reads could not be read (checker exit 2)", file=sys.stderr)
              raise SystemExit(2)
          if others:
              raise SystemExit(1)
          raise SystemExit(0)
          PY

  docs:
    name: docs (mkdocs build --strict)
    runs-on: ubuntu-latest
    needs: scope
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r docs/requirements.txt
      - name: Link health (broken links, back-links)
        run: python scripts/teamwork.py links
      - name: mkdocs build --strict
        run: mkdocs build --strict
