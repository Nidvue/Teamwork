# Continuous integration for teamwork-agents.
#
# Contract: docs/Team/Architecture.md (section 9) and docs/Team/Project.md
# (AC-4 CI matrix, AC-5 privacy, AC-2 no runtime deps, AC-9 cross-platform).
#
# Jobs: lint, typecheck (non-blocking), test (3 OS x 3 Python), build, privacy,
# docs. Every job must be green on the pushed revision.
#
# Trigger policy: a documentation-only change must not burn the 3x3 test matrix.
# Prose paths are ignored here and validated by `.github/workflows/docs.yml`
# instead (links, privacy scan, mkdocs --strict). Anything that ships - `src/`,
# `scripts/`, `tests/`, `roles/`, `references/`, `templates/`, packaging, CI
# itself - always runs this workflow.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "CITATION.cff"
      - "LICENSE"
      - "AGENTS.md"
      - "assets/**"
      - "mkdocs.yml"
  # A pull request always runs every required check. Required status checks must
  # be *reported* on the merge revision: a workflow skipped by `paths-ignore`
  # reports no check at all, so a docs-only PR would wait forever on a check that
  # can never appear. The path filter therefore applies to `push` only, where the
  # matrix is a cost optimisation rather than a merge gate.
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref, but never a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: typecheck (mypy, non-blocking)
    runs-on: ubuntu-latest
    # mypy is a report, not a gate: keep the signal without blocking the lane.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' || python -m pip install -e .
          python -m pip install mypy
      - name: mypy
        run: mypy src/teamwork

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' || python -m pip install -e .
          python -m pip install pytest pytest-cov
      - name: Run tests (junit + coverage)
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=teamwork \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing
      - name: Upload junit + coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn

  build:
    name: build (sdist + wheel + verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify release artifacts
        run: python scripts/verify_release.py
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  privacy:
    name: privacy scan (tree + history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No `cache: pip` here on purpose: this job installs nothing, and
      # actions/setup-python's post step fails the job when the pip cache
      # directory it was told to save does not exist.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan working tree and full git history
        run: python scripts/privacy_scan.py --tree --history

  docs:
    name: docs (mkdocs build --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' || python -m pip install -e .
          python -m pip install mkdocs mkdocs-material
      - name: mkdocs build --strict
        run: mkdocs build --strict
