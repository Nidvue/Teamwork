# Continuous integration for teamwork-agents.
#
# Contract: docs/Team/Architecture.md (section 9, "CI / release contract") and
# docs/Team/Project.md (AC-4 CI matrix, AC-5 privacy, AC-2 no runtime deps,
# AC-9 cross-platform). The path filtering itself is described in this header,
# implemented by `scripts/ci_scope.py`, and run by the `scope` job below - never
# by a workflow-level filter.
#
# Jobs: scope, lint, typecheck (non-blocking), test (5-cell OS/Python matrix, the
# Windows cell split into five path shards), build, privacy, committer guard,
# release-consistency, docs, docs-contract. Every job must be green on the pushed
# revision.
#
# The matrix is sized to the portability question instead of running the whole
# suite five times (T-0105). The question is "does the suite work on the Python
# versions and the OSes we support", and the two interpreters that answer it are
# the boundaries - 3.11 (`requires-python`'s floor) and 3.13 (the newest
# classifier) - so those two Linux cells run every test, 3.11 with the coverage
# gate. The interior Linux interpreter (3.12) and macOS run the named subset
# `tests/unit tests/acceptance`: the unit tree is where the platform-specific
# paths are asserted (`tests/unit/test_portability.py`, `src/teamwork/portable.py`)
# and acceptance is the cheap 8s proof of the ACs, while the subprocess-heavy
# integration tree (338 tests, 30% of the serial wall clock) already runs on both
# boundary interpreters and on all five Windows shards. Every cell
# runs under pytest-xdist `--numprocesses=auto` (`-n auto`) except the Windows
# shards, which are already split by path: measured 242s serial against 94s with
# `-n 4` (the 4-vCPU emulation of a hosted runner) on the same tree, identical
# results.
#
# Trigger policy: a documentation-only change must not burn the test matrix,
# and a release-fact change must not escape the consistency gate. Those two rules
# used to fight: `paths-ignore` on the push trigger was the only filter available
# at workflow level, so a prose-only push skipped every job in this file -
# including a `release-consistency` job whose whole subject is prose that
# disagrees with a tag, `version.py` or `CHANGELOG.md`. A gate skipped exactly
# when the documentation drifts is worthless, so the workflow now always fires on
# `main`, on a `v*` tag and on every pull request; the `scope` job classifies the
# changed paths (the prose/media set below) and the expensive jobs skip on a push
# only. A pull request still runs the full set: required checks must be
# *reported* on the merge revision, and a path filtered skip reports nothing.
#
# The classifier publishes two answers, not one, because "does this ship?" and
# "is this prose?" are different questions with different gates behind them:
#
#   * `code`  - true when anything that ships changed. The test matrix, mypy and
#               the packaging job read this, and only this: a prose edit cannot
#               change what they measure.
#   * `prose` - true when the change set is prose/media only. The `privacy` and
#               `docs` jobs read `code || prose`: the privacy gate reads the git
#               history and every commit MESSAGE, and a merge commit is created
#               at merge time, so a prose-only merge is exactly the push whose
#               message no other gate would see; the docs job's link health and
#               strict build are about the prose itself. A tag push emits
#               neither, and only the tag-sensitive jobs run.
#
# Prose paths are also validated by `.github/workflows/docs.yml` (links, privacy
# scan, mkdocs --strict). That workflow's `paths:` list is pinned to
# `scripts/ci_scope.py::prose_paths` by tests/unit/test_ci_scope.py, so the two
# gates cannot drift apart.
#
# The consistency gate in this file runs `--offline`, so R3/R4/R5/R8 (npm, the
# GitHub API, PyPI) print SKIP here. The online half - the same checker with
# `--online` - runs in `.github/workflows/release.yml` (the `consistency` job),
# not in this file; this file does not claim to run it.

name: CI

on:
  push:
    branches: [main]
    # A tag is a release fact in its own right: R1/R2/R4/R5 compare every `v*`
    # tag with the version at its own commit, so the gate must also see the tag
    # that was just created, not only the branch push that preceded it.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref, but never a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  scope:
    name: scope (code or prose only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The workflow can no longer delegate the prose filter to `paths-ignore`
    # (see the header), so `scripts/ci_scope.py` computes the changed-path set
    # from git and the matrix jobs ask one question: did this push touch
    # anything that ships?
    outputs:
      # `code`: does this change ship. `prose`: is it prose/media only.
      code: ${{ steps.diff.outputs.code }}
      prose: ${{ steps.diff.outputs.prose }}
    steps:
      - name: Checkout (full history so the push range resolves)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Classify the changed paths
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/ci_scope.py --output "${GITHUB_OUTPUT}"

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A prose-only push cannot change a file ruff reads, so this is pure waste
    # there; it was skipped entirely by the old `paths-ignore`, and it still is.
    needs: scope
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true'
    steps:
      - name: Checkout (full history for the commit identity audit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project's pinned tooling
        # `pyproject.toml`'s `dev` extra is the pin. Installing the newest ruff
        # from PyPI made this required check run whatever rules that day's
        # release shipped: the pin says `ruff>=0.9,<0.18`, so the day 0.18.0
        # landed the gate would have failed a revision that changed nothing.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: no comments in code
        run: python scripts/check_comments.py
      - name: Commit identity audit
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            python scripts/teamwork.py identity --audit --strict-authors --range "origin/${BASE_REF}..HEAD"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            python scripts/teamwork.py identity --audit --strict-authors --range "${BEFORE_SHA}..${HEAD_SHA}"
          else
            python scripts/teamwork.py identity --audit --strict-authors --range HEAD
          fi

  committer-guard:
    name: committer guard (no account stamped into main)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The earliest signal for the one mistake that has rewritten this branch
    # three times: a host merge button (squash or rebase) writes the signed-in
    # account into the commit it creates, and the privacy gate then fails on that
    # personal mailbox in the history - which fails the whole matrix through the
    # acceptance proof that re-runs it. This job fires on the push, with the
    # offending commit named and the repair printed.
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Guard the committer of the pushed revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A pull request is judged on its own change-set, from the base sha the
          # event carries. `github.event.before` is a push field: on a pull request
          # it can hold a base tip that no longer resolves after main advanced, and
          # the old ordering then audited the whole ancestry (run 40789321527
          # flagged an accepted main ancestor). So the PR arm comes first.
          #
          # A tag push has no "before" (all zeros); audit the tagged commit alone.
          # A first branch push has no measurable span, so audit the tip commit.
          # An unreadable range is the engine's own fallback (the tip commit only,
          # never the ancestry), so there is no second invocation here.
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_SHA}" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE_SHA}..${HEAD_SHA}"
          else
            RANGE="${HEAD_SHA}^..${HEAD_SHA}"
          fi
          python scripts/teamwork.py identity --guard-committer --range "${RANGE}"

  typecheck:
    name: typecheck (mypy, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scope
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true'
    # mypy is a report, not a gate: keep the signal without blocking the lane.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: mypy
        run: mypy src/teamwork

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Capacity, not a gate: every test still runs. Measured 18 min on ubuntu 3.13
    # and 30 on macos 3.13; windows hit the old 60-minute cap twice (runs
    # 42530928486, 42533590196) because this suite spawns hundreds of processes
    # and Windows spawns them several times slower. Sharding the Windows lane is
    # tracked as a Tester task; the bound is re-read from Architecture.md 9.
    timeout-minutes: 90
    needs: scope
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            coverage: true
            xdist: "--numprocesses=auto"
          # The interior interpreter: the unit and acceptance trees, not the
          # subprocess-heavy integration tree. 3.11 (the floor) and 3.13 (the
          # newest) carry the whole suite, so no test loses its only run.
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: false
            xdist: "--numprocesses=auto"
            paths: "tests/unit tests/acceptance"
          - os: ubuntu-latest
            python-version: "3.13"
            coverage: false
            xdist: "--numprocesses=auto"
          # macOS runs the cheap subset plus the one integration module that
          # exists for it: tests/integration/test_portability_flow.py drives the
          # spaced-path CLI, the symlink and the GNU-make guards as real
          # subprocesses on a host that is not the one the code was written on.
          # No test in the tree branches on darwin and the Windows shards plus
          # both Linux boundaries already run the whole integration tree, so the
          # rest of it stays off this cell: one 12-18 minute full-suite job was
          # the second-longest lane in runs 43000716956 and 43014809518.
          - os: macos-latest
            python-version: "3.13"
            coverage: false
            xdist: "--numprocesses=auto"
            paths: "tests/unit tests/acceptance tests/integration/test_portability_flow.py"
          # Windows spawns processes several times slower than the POSIX runners and
          # this suite spawns hundreds of them, so one Windows job exceeded the
          # 90-minute cap even after the traceability guard stopped re-running the
          # privacy scan (run 42941335942). Five shards, no plugin and no new
          # dependency. The three unit letter ranges are one row each and the two
          # subprocess-heavy trees stand alone, because the first split left unit
          # a-f carrying integration and acceptance and that row was cancelled at
          # the cap on run 43000716956. A cancelled shard now names the files it was
          # running instead of hiding the whole lane.
          - os: windows-latest
            python-version: "3.13"
            coverage: false
            shard: "unit-a-f"
            paths: "tests/unit/test_[a-f]*.py"
          - os: windows-latest
            python-version: "3.13"
            coverage: false
            shard: "unit-g-o"
            paths: "tests/unit/test_[g-o]*.py"
          - os: windows-latest
            python-version: "3.13"
            coverage: false
            shard: "unit-p-z"
            paths: "tests/unit/test_[p-z]*.py"
          - os: windows-latest
            python-version: "3.13"
            coverage: false
            shard: "integration"
            paths: "tests/integration"
          - os: windows-latest
            python-version: "3.13"
            coverage: false
            shard: "acceptance"
            paths: "tests/acceptance"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Assert the history is full
        shell: bash
        run: |
          # The archive guard skips itself in a shallow clone instead of failing.
          # That is correct for a contributor's shallow copy, and wrong for CI, so
          # the checkout config is asserted here rather than trusted.
          test "$(git rev-parse --is-shallow-repository)" = "false"
      - name: Run tests with the coverage gate (ubuntu 3.11)
        if: matrix.coverage
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest -q --numprocesses=auto \
            --junitxml=reports/junit.xml \
            --cov=teamwork \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=55
      - name: Run tests (plain)
        if: ${{ !matrix.coverage }}
        shell: bash
        run: |
          mkdir -p reports
          python -m pytest -q ${{ matrix.xdist }} --junitxml=reports/junit.xml ${{ matrix.paths }}
      - name: Upload junit + coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.shard || 'all' }}
          path: reports/
          if-no-files-found: warn

  build:
    name: build (sdist + wheel + verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: scope
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify release artifacts
        run: python scripts/verify_release.py
      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  privacy:
    name: privacy scan (tree + history)
    runs-on: ubuntu-latest
    # 30, not 15, because the budget is a measurement: the same command takes
    # 8m02s on a 597-commit history on the development host (a laptop with a warm
    # cache), and a hosted runner with a cold object store took 15m15s and was
    # cancelled at the old budget - T-0090. A gate that is cancelled for being
    # slow reports nothing, which is worse than a longer budget; the scan itself
    # is unchanged and still walks every blob and every commit message.
    timeout-minutes: 30
    needs: scope
    # Prose-only pushes included: this gate reads the git history and every
    # commit message, and a merge commit is created at merge time - so a
    # prose-only merge is exactly the push whose message no other gate reads.
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true' || needs.scope.outputs.prose == 'true'
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      # No `cache: pip` here on purpose: this job installs nothing, and
      # actions/setup-python's post step fails the job when the pip cache
      # directory it was told to save does not exist.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Scan working tree and full git history
        run: python scripts/privacy_scan.py --tree --history --allow .github/privacy-allow.txt

  release-consistency:
    name: release consistency (offline - docs + tags + version)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking on purpose - no `continue-on-error`. Every published fact about
    # "what version is out" (a git tag, an npm tarball, a GitHub Release, a
    # sentence in README.md or docs/Team/Release.md, the CHANGELOG entry, the
    # PyPI channel lines) must agree with `src/teamwork/version.py`. Exit 0 is
    # clean, exit 1 is drift, exit 2 is an unreadable input; 1 and 2 must fail
    # the run.
    #
    # `--offline` is deliberate. R3/R4/R5/R8 need the npm registry, the GitHub API
    # and PyPI; those need credentials and rate-limit headroom that does not
    # belong in every pull request, and an unauthenticated 403 would turn a gate
    # into a flake. Offline they print SKIP with the reason, and every local rule
    # (R1, R2, R6, R7, R9) still evaluates from the tree and the tags. The online
    # half - the same checker with `--online` - runs in
    # `.github/workflows/release.yml` (the `consistency` job); nothing in this
    # file claims to run it.
    #
    # R2 is not re-implemented here. R2 compares HEAD only against the version
    # tags reachable from HEAD minus the tags that point at HEAD (`S = A - O`);
    # the frozen contract for it is in `docs/Team/Architecture.md` ("Release
    # consistency contract"), and the checker (developer task T-0005) computes
    # that set itself. This job used to parse the checker's English
    # detail text to re-apply the frozen tag set; that was a second source of
    # truth for a rule the checker owns, and it is gone. The checker's own R2
    # decides, so a tag push is green because the checker excludes the tag at
    # HEAD - not because the workflow hid the finding.
    #
    # R2's scope (11.2.2.1, D-20261029-Architect): a pull request publishes
    # nothing, so the gate passes `--head-is-default-branch=no` there and R2
    # reports SKIP instead of a false DRIFT on a branch cut from a
    # tagged-but-unbumped `main`. Every other event - a push to `main`, a `v*`
    # tag push - keeps the fail-closed default `yes`, so R2 is still evaluated
    # where a version is actually published, and a tag placed on an older commit
    # is still caught. One flag, one invocation; the rule is not re-implemented
    # in shell here.
    #
    # If `scripts/check_release_consistency.py` is not in the tree the gate
    # cannot run at all. That is reported plainly and the job fails with exit
    # 2: the checker is the subject of the gate, so its absence is an
    # unreadable input, not a pass and not a confusing "no report" error.
    steps:
      - name: Checkout (full history and tags - R1/R2/R4/R5 read git tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true
      # No `cache: pip` here on purpose: the gate is standard-library only and
      # installs nothing, and setup-python's post step fails the job when the pip
      # cache directory it was told to save does not exist.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Release consistency gate (offline)
        env:
          # 11.2.2.1: `no` on a pull request (R2 SKIP - nothing is published),
          # `yes` on every other event (R2 evaluated - the fail-closed default).
          # Both arms are spelled out, so a change of either is reviewable, and
          # deleting this line cannot make the gate green: the checker's own
          # default is `yes`.
          HEAD_IS_DEFAULT_BRANCH: ${{ github.event_name == 'pull_request' && 'no' || 'yes' }}
        run: |
          set -uo pipefail
          CHECKER="scripts/check_release_consistency.py"
          if [ ! -f "${CHECKER}" ]; then
            echo "::error::the release consistency checker is not in the tree (${CHECKER} is absent), so the gate cannot run. This revision does not carry the checker; the required check must not be registered as blocking until the checker is merged." >&2
            exit 2
          fi
          REPORT="$(mktemp)"
          GATE_RC=0
          python "${CHECKER}" --offline --json --head-is-default-branch="${HEAD_IS_DEFAULT_BRANCH}" > "${REPORT}" || GATE_RC=$?
          python - "${REPORT}" "${GATE_RC}" <<'PY'
          import json
          import sys

          report, gate_rc = sys.argv[1], int(sys.argv[2])
          try:
              with open(report, encoding="utf-8") as handle:
                  payload = json.load(handle)
          except (OSError, ValueError) as exc:
              # The checker did not produce a report: it crashed, or its output
              # is not JSON. Its own exit code is the truth (2 = an input could
              # not be read), and the job must fail either way.
              print(f"::error::the checker produced no report: {exc}", file=sys.stderr)
              raise SystemExit(gate_rc if gate_rc else 2)

          for rule in payload.get("rules", []):
              print(f"{rule['id']} {rule['status']} {rule['detail']}")

          problems = payload.get("problems", [])
          for problem in problems:
              print(f"::error::{problem['rule']} DRIFT: {problem['detail']}", file=sys.stderr)
          print(f"# release consistency: {len(problems)} problem(s)")

          if gate_rc == 2:
              print("::error::an input the gate reads could not be read (checker exit 2)", file=sys.stderr)
              raise SystemExit(2)
          if problems:
              raise SystemExit(1)
          raise SystemExit(0)
          PY

  docs:
    name: docs (mkdocs build --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scope
    # A prose-only push is exactly the change this job is about, so it runs on
    # `code || prose`: link health and the strict build are prose checks.
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true' || needs.scope.outputs.prose == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r docs/requirements.txt
      - name: Link health (broken links, back-links)
        run: python scripts/teamwork.py links
      - name: mkdocs build --strict
        run: mkdocs build --strict

  docs-contract:
    name: docs contract (tests that read the prose)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scope
    # The expensive matrix reads code, and a prose-only push is right to skip it.
    # But these five files read README.md and docs/, so a prose push can turn them
    # red while the matrix is skipped: the README merge that dropped the install
    # command and the provider-cap statement both landed as "prose". They are
    # seconds of work, so they run on `code || prose` and on every event.
    if: github.event_name != 'push' || needs.scope.outputs.code == 'true' || needs.scope.outputs.prose == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Tests that read the prose
        run: |
          python -m pytest -q \
            tests/acceptance/test_acceptance_docs.py \
            tests/unit/test_readme_layout.py \
            tests/unit/test_provider_caps.py \
            tests/unit/test_docs_contracts.py \
            tests/unit/test_skill_contracts.py
